name: PythonStart CI Pipeline

on:
  push:
    branches:
      - main
      - ci/13-github-actions-setup
      - release/14-pythonstart
  pull_request:
    branches:
      - main
      - fix/topics-safe-filter-and-stats
      - ci/13-github-actions-setup

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Linter & Unit Tests (Node.js 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.x"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Static analysis
        run: npm run lint
      - name: Unit tests
        run: npm test
